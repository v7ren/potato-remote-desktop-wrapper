<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solinear toolbar</title>
<style>
  :root { color-scheme: dark; --ink: #e8eaef; --dim: #e8eaef99; --accent: #6c8cff; font: 13px/1.35 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent !important; overflow: hidden; color: var(--ink); user-select: none; -webkit-user-select: none; }
  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  [hidden] { display: none !important; }
  #wrap { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 2px; }
  #pill { display: flex; align-items: center; gap: 2px; height: 42px; padding: 0 8px 0 4px; border-radius: 21px; background: rgba(14, 16, 20, .55); border: 1px solid rgba(255, 255, 255, .45); backdrop-filter: blur(10px); }
  #grip { width: 22px; height: 34px; display: grid; place-items: center; color: var(--dim); cursor: grab; }
  #grip svg, #grip use { pointer-events: none; }
  .tb { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 8px; border-radius: 9px; }
  .tb:hover { background: rgba(255, 255, 255, .13); }
  .tb[aria-pressed="true"], .tb[aria-expanded="true"] { background: rgba(108, 140, 255, .38); }
  .game { text-align: left; line-height: 1.1; }
  .game small { display: block; font-size: 10px; color: var(--dim); }
  #panel { width: 270px; max-height: 420px; overflow-y: auto; padding: 6px; border-radius: 12px; background: rgba(14, 16, 20, .82); border: 1px solid rgba(255, 255, 255, .35); backdrop-filter: blur(14px); box-shadow: 0 8px 28px rgba(0, 0, 0, .5); }
  .it { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 7px; text-align: left; }
  .it:hover, .it:focus-visible { background: rgba(255, 255, 255, .15); }
  .it .lab { flex: 1; }
  .it .hint { color: var(--dim); font-size: 12px; }
  .it .ck { width: 14px; height: 14px; }
  .it:disabled { color: var(--dim); cursor: default; background: none; }
  .back { color: var(--dim); font-weight: 600; }
  .sep { height: 1px; background: rgba(255, 255, 255, .2); margin: 5px 6px; }
  .note { padding: 6px 10px; color: var(--dim); font-size: 12px; }
  .ask { padding: 8px 10px; font-size: 14px; }
  .btns { display: flex; gap: 8px; padding: 6px 10px 8px; }
  .btns button { flex: 1; padding: 8px; border-radius: 8px; background: rgba(255, 255, 255, .14); }
  .btns button.danger { background: #d9534f; color: #fff; font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { #panel { animation: pop .12s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(-4px); } } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g></symbol>
  <symbol id="full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="pad" viewBox="0 0 24 24"><path d="M7 9h4M9 7v4M15 9.5h.01M17.5 11.5h.01"/><path d="M7.5 5h9a5 5 0 0 1 5 5v1.5a3.5 3.5 0 0 1-6.2 2.2L14 12.5h-4l-1.3 1.2A3.5 3.5 0 0 1 2.5 11.5V10a5 5 0 0 1 5-5z"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>
<div id="wrap">
  <div id="pill" data-tauri-drag-region>
    <div id="grip" data-tauri-drag-region title="Drag to move"><svg><use href="#grip"/></svg></div>
    <button class="tb" id="fullBtn"><svg><use href="#full"/></svg></button>
    <button class="tb game" id="gameBtn" aria-pressed="false"><svg><use href="#pad"/></svg><span>Gaming mode<small id="gameKey"></small></span></button>
    <button class="tb" id="menuBtn" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" title="Menu"><svg><use href="#menu"/></svg></button>
  </div>
  <div id="panel" role="menu" hidden></div>
</div>
<script>if (!window.__TAURI__) document.write('<script src="mock.js"><\/script>');</script>
<script src="toolbar.js"></script>
</body>
</html>
