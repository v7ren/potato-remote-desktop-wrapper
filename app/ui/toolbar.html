<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solinear toolbar</title>
<style>
  :root { color-scheme: dark; --ink: #f2f2f2; --dim: #777; --red: #d71921; font: 12px/1.35 "JetBrains Mono", ui-monospace, Consolas, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent !important; overflow: hidden; color: var(--ink); user-select: none; -webkit-user-select: none; }
  svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
  [hidden] { display: none !important; }
  #wrap { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 2px; }
  #pill { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 6px 0 2px; border-radius: 999px; background: rgba(12, 12, 12, .94); border: 1px solid #303030; backdrop-filter: blur(10px); }
  #grip { width: 24px; height: 32px; display: grid; place-items: center; color: #555; cursor: grab; }
  #grip:hover { color: var(--ink); }
  #grip svg, #grip use { pointer-events: none; }
  #screens { display: flex; padding: 2px; margin-right: 2px; border: 1px solid #242424; border-radius: 999px; background: #050505; }
  #screens button { padding: 3px 10px; border-radius: 999px; color: var(--dim); font-size: 11px; }
  #screens button:hover { color: #fff; }
  #screens button[aria-pressed="true"] { background: var(--ink); color: #050505; }
  .tb { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 999px; color: #aaa; font-size: 11px; }
  .tb:hover { color: #fff; background: #1a1a1a; }
  .tb[aria-pressed="true"], .tb[aria-expanded="true"] { background: var(--ink); color: #050505; }
  #panel { width: 260px; max-height: 420px; overflow-y: auto; padding: 6px; border-radius: 2px; background: rgba(12, 12, 12, .97); border: 1px solid #2a2a2a; box-shadow: 0 12px 32px rgba(0, 0, 0, .6); }
  .it { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; text-align: left; color: #ccc; }
  .it:hover, .it:focus-visible { background: #181818; color: #fff; }
  .it .lab { flex: 1; }
  .it .hint { color: #555; font-size: 10px; }
  .it .ck { width: 13px; height: 13px; }
  .it:disabled { color: #555; cursor: default; background: none; }
  .back { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .12em; }
  .sep { border-top: 1px dotted #262626; margin: 5px 4px; }
  .note { padding: 6px 10px; color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .ask { padding: 8px 10px; font-size: 13px; }
  .btns { display: flex; gap: 6px; padding: 6px 10px 8px; }
  .btns button { flex: 1; padding: 7px; border: 1px solid #2a2a2a; color: #aaa; }
  .btns button:hover { color: #fff; border-color: #444; }
  .btns button.danger { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { #panel { animation: pop .12s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(-4px); } } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g></symbol>
  <symbol id="full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g></symbol>
  <symbol id="pad" viewBox="0 0 24 24"><path d="M7 9h4M9 7v4M15 9.5h.01M17.5 11.5h.01"/><path d="M7.5 5h9a5 5 0 0 1 5 5v1.5a3.5 3.5 0 0 1-6.2 2.2L14 12.5h-4l-1.3 1.2A3.5 3.5 0 0 1 2.5 11.5V10a5 5 0 0 1 5-5z"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>
<div id="wrap">
  <div id="pill" data-tauri-drag-region>
    <div id="grip" data-tauri-drag-region title="Drag to move"><svg><use href="#grip"/></svg></div>
    <div id="screens" role="group" aria-label="Host screen" hidden></div>
    <button class="tb" id="fullBtn"><svg><use href="#full"/></svg></button>
    <button class="tb game" id="gameBtn" aria-pressed="false"><svg><use href="#pad"/></svg><span>GAME</span></button>
    <button class="tb" id="menuBtn" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" title="Menu"><svg><use href="#menu"/></svg></button>
  </div>
  <div id="panel" role="menu" hidden></div>
</div>
<script>if (!window.__TAURI__) document.write('<script src="mock.js"><\/script>');</script>
<script src="toolbar.js"></script>
</body>
</html>
