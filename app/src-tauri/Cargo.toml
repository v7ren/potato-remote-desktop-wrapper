[package]
name = "solinear"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] } # transparent toolbar window on macOS; our tray icon
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell",
] }

[profile.release]
opt-level = "s"
lto = true
